name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - run: make integration

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Creates a *draft* GitHub release with .deb, .rpm, tarballs and checksums.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are only visible to tokens with write access.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: download draft release assets
        run: gh release download "$GITHUB_REF_NAME" --dir dist --pattern '*'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: verify checksums
        run: cd dist && sha256sum -c checksums.txt
      - name: install the published artifacts on Debian, Ubuntu, Fedora and Alpine
        run: test/packaging/smoke.sh dist

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: publish the release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
